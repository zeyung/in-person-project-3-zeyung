<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A data-driven frontend development portfolio.">
    <title>Victor Ezike | Data-Driven Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar" aria-label="Main navigation">
        <div class="nav-inner">
            <a class="nav-brand" href="#top">VE</a>
            <ul class="nav-menu">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main id="top">
        <!-- data.js runs first; display.js writes the portfolio sections from its data. -->
        <script src="data.js"></script>
        <script src="display.js"></script>

        <section id="contact">
            <h2>Contact</h2>
            <p>This form demonstrates native HTML5 input types and browser validation. It does not send or store messages.</p>

            <form class="contact-form" action="#contact" method="get" onsubmit="return false;">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-field">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>

                    <div class="form-field">
                        <label for="start-date">Preferred start date</label>
                        <input type="date" id="start-date" name="start-date">
                    </div>

                    <div class="form-field">
                        <label for="budget">Budget (USD)</label>
                        <input type="number" id="budget" name="budget" min="0" step="100">
                    </div>

                    <fieldset>
                        <legend>Preferred contact method</legend>
                        <div class="form-row">
                            <input type="radio" id="contact-email" name="contact-method" value="email">
                            <label for="contact-email">Email</label>
                        </div>
                        <div class="form-row">
                            <input type="radio" id="contact-phone" name="contact-method" value="phone">
                            <label for="contact-phone">Phone</label>
                        </div>
                    </fieldset>

                    <fieldset class="form-field-full">
                        <legend>Project timeline</legend>
                        <div class="form-row">
                            <input type="checkbox" id="asap" name="timeline" value="asap">
                            <label for="asap">ASAP</label>
                        </div>
                        <div class="form-row">
                            <input type="checkbox" id="flexible" name="timeline" value="flexible">
                            <label for="flexible">Flexible</label>
                        </div>
                    </fieldset>

                    <div class="form-field form-field-full">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </div>
                </div>

                <button type="submit">Check required fields</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Victor Ezike · Data-driven portfolio project</p>
    </footer>
</body>
</html>
